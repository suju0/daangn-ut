<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 당근</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 아이콘 스프라이트: 원본에서는 이 위치에 <svg class="sprite"> 가 인라인되어 있었습니다.
     분리판에서는 assets/icons/sprite.svg 를 주입해 <use href="#id"> 참조를 유지합니다. -->
<div id="spriteHost" hidden></div>

<div class="phone" id="app">
  <div class="sb"><span>11:33</span><span class="ic">
    <svg width="17" height="17" viewBox="0 0 24 24"><use href="#sb-plane"/></svg>
    <svg width="18" height="14" viewBox="0 0 20 15"><use href="#sb-wifi"/></svg>
    <svg width="26" height="14" viewBox="0 0 27 14"><use href="#sb-batt"/></svg>
  </span></div>
  <div class="ph"><h2>나의 당근</h2>
    <svg width="27" height="27" viewBox="0 0 24 24" id="gearBtn"><use href="#gear"/></svg></div>

  <div class="scroll">
    <div class="card">
      <div class="prof">
        <span class="avatar"><svg width="52" height="52" viewBox="0 0 52 52"><use href="#av"/></svg></span>
        <span class="nm"><b>우리동네두쫀쿠사천원</b><span class="temp">37.5°C</span></span>
        <i style="display:block;width:6.5px;height:10.8px;border-right:1.8px solid var(--chev);border-top:1.8px solid var(--chev);transform:rotate(45deg)"></i>
      </div>
      <div class="pay">
        <div class="pay-top">
          <span class="lg"><svg width="59.6" height="27.1" viewBox="0 0 48 22"><use href="#pay-logo"/></svg></span>
          <a href="#">충전</a><span class="vr"></span><a href="#">송금</a>
          <span class="pill"><svg width="14.1" height="14.1" viewBox="0 0 24 24" style="margin-right:3.3px"><use href="#scan"/></svg>결제</span>
        </div>
        <div class="wallet">
          <div>머니 <b>0원</b><i></i></div>
          <div>포인트 <b>0원</b><i></i></div>
          <div>혜택 <b>2개</b><i></i></div>
        </div>
      </div>
    </div>

    <div class="card sp seg" role="group" aria-label="나의 당근 영역">
      <button type="button" id="segDeal" aria-selected="true">나의 거래</button>
      <button type="button" id="segSvc" aria-selected="false">당근 서비스</button>
    </div>

    <!-- ══════════ 나의 거래 ══════════ -->
    <div id="tabDeal">
      <div class="card sp">
        <div class="tri">
          <button type="button" data-k="sell" aria-selected="true">
            <span class="ic"><svg width="27.1" height="24.9" viewBox="0 0 24 24"><use href="#m-sell"/></svg></span>
            <span class="lb">판매</span></button>
          <button type="button" data-k="buy" aria-selected="false">
            <span class="ic"><svg width="26" height="24.9" viewBox="0 0 24 24"><use href="#m-buy"/></svg></span>
            <span class="lb">구매</span></button>
          <button type="button" data-k="like" aria-selected="false">
            <span class="ic"><svg width="27.1" height="24.9" viewBox="0 0 24 24"><use href="#q-heart"/></svg></span>
            <span class="lb">관심</span></button>
        </div>
        <div id="plist"></div>
        <button type="button" class="allrow" id="allBtn"><span id="allTxt">판매내역</span> <b>전체보기</b><i></i></button>
      </div>

      <div class="card sp">
        <div class="ctit">거래 관리</div>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-sell"/></svg></span><span class="ml">판매관리</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-buy"/></svg></span><span class="ml">구매내역</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-price"/></svg></span><span class="ml">내 물건 가격 찾기</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-ledger"/></svg></span><span class="ml">중고거래 가계부</span><i></i></button>
      </div>

      <div class="card sp">
        <div class="ctit">나의 관심</div>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#q-heart"/></svg></span><span class="ml">관심목록</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-keyword"/></svg></span><span class="ml">키워드 알림 설정</span><i></i></button>
      </div>
    </div>

    <!-- ══════════ 당근 서비스 ══════════ -->
    <div id="tabSvc" hidden>
      <div class="card sp">
        <div class="chead"><span class="ctit">서비스</span>
          <button type="button" class="more" data-nav="전체보기">전체보기<i></i></button></div>
        <div class="sgrid">
          <a href="#"><span class="si"><svg width="45.5" height="45.5" viewBox="0 0 50 50"><use href="#svc-used"/></svg><span class="sbadge">3</span></span><span class="sl">중고거래</span></a>
          <a href="#"><span class="si"><svg width="45.5" height="45.5" viewBox="0 0 50 50"><use href="#svc-meet"/></svg></span><span class="sl">모임</span></a>
          <a href="#"><span class="si"><svg width="45.5" height="45.5" viewBox="0 0 50 50"><use href="#svc-job"/></svg></span><span class="sl">알바</span></a>
          <a href="#"><span class="si"><svg width="45.5" height="45.5" viewBox="0 0 50 50"><use href="#svc-laundry"/></svg></span><span class="sl">세탁수거</span></a>
          <a href="#"><span class="spill">오픈형 원룸</span><span class="si"><svg width="45.5" height="45.5" viewBox="0 0 50 50"><use href="#svc-estate"/></svg></span><span class="sl">부동산</span></a>
          <a href="#"><span class="si"><svg width="45.5" height="45.5" viewBox="0 0 50 50"><use href="#svc-apt"/></svg></span><span class="sl">내 아파트</span></a>
          <a href="#"><span class="si"><svg width="45.5" height="45.5" viewBox="0 0 50 50"><use href="#svc-car"/></svg><span class="sbadge">3</span></span><span class="sl">중고차</span></a>
          <a href="#"><span class="si"><svg width="45.5" height="45.5" viewBox="0 0 50 50"><use href="#svc-walk"/></svg></span><span class="sl">동네걷기</span></a>
        </div>
      </div>

      <div class="card sp">
        <div class="ctit">나의 활동</div>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-teacher"/></svg></span><span class="ml">선생님 프로필 관리</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-post"/></svg></span><span class="ml">내 동네생활 글</span><i></i></button>
      </div>

      <div class="card sp">
        <div class="ctit">나의 비즈니스</div>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-biz"/></svg></span><span class="ml">비즈프로필 관리</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-ad"/></svg></span><span class="ml">광고</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-lounge"/></svg></span><span class="ml">사장님 라운지</span><i></i></button>
      </div>

      <div class="card sp">
        <div class="ctit">설정</div>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-loc"/></svg></span><span class="ml">내 동네 설정</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-crosshair"/></svg></span><span class="ml">동네 인증하기</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#scan"/></svg></span><span class="ml">QR 코드 스캔</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#gear"/></svg></span><span class="ml">앱 설정</span><i></i></button>
      </div>

      <div class="card sp">
        <div class="ctit">고객지원</div>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-ad"/></svg></span><span class="ml">공지사항</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-cs"/></svg></span><span class="ml">고객센터</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-mail"/></svg></span><span class="ml">의견 남기기</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-exit"/></svg></span><span class="ml">탈퇴하기</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-carrot"/></svg></span><span class="ml">당근 더 알아보기</span><i></i></button>
        <button type="button" class="mrow"><span class="mi"><svg width="23.8" height="23.8" viewBox="0 0 24 24"><use href="#m-info"/></svg></span><span class="ml">약관 및 정책</span><i></i></button>
      </div>

      <div class="legal">
        <button type="button" class="biz">(주) 당근마켓 사업자 정보<i></i></button>
        <p>당근마켓은 본 플랫폼을 통한 통신판매의 당사자가 아니며, 해당 거래정보 및 내용에 대하여 책임을 지지 않습니다.</p>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div><svg width="26" height="26" viewBox="0 0 26 26"><use href="#n-home"/></svg>홈</div>
    <div><svg width="26" height="26" viewBox="0 0 26 26"><use href="#n-comm"/></svg>커뮤니티</div>
    <div><svg width="26" height="26" viewBox="0 0 26 26"><use href="#n-map"/></svg>동네지도</div>
    <div><svg width="26" height="26" viewBox="0 0 26 26"><use href="#n-chat"/></svg>채팅</div>
    <div class="on"><svg width="26" height="26" viewBox="0 0 26 26"><use href="#n-my"/></svg>나의 당근</div>
  </div>
</div>

<p class="ut-hint">탭할 수 있는 프로토타입입니다.</p>

<script>
/* 스프라이트 주입 — 분리 구조에서만 필요한 유일한 추가 코드.
   file:// 에서는 fetch 가 차단되므로 로컬 서버로 열어주세요. */
fetch('assets/icons/sprite.svg')
  .then(function (r) { return r.text(); })
  .then(function (svg) {
    document.getElementById('spriteHost').innerHTML = svg;
    var s = document.createElement('script');
    s.src = 'js/app.js';
    document.body.appendChild(s);
  });
</script>
</body>
</html>
